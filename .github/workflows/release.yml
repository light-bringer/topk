name: Release

# Publishing uses PyPI Trusted Publishing: PyPI trusts this workflow's identity, so no API token is
# stored anywhere. See docs/releasing.md for the one-time setup and the release steps.
#
#   push a tag vX.Y.Z      build, check, test the wheel, publish to PyPI
#   run it by hand         build, check, test the wheel, publish to TestPyPI (a dry run)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      repository:
        description: "Where to publish (pypi needs the run to be on a v* tag)"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check that the tag matches the version in pyproject.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: python .github/scripts/check_release_tag.py "$GITHUB_REF_NAME"
      - run: python -m pip install -U pip build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  smoke-test:
    name: smoke test (${{ matrix.python }}, ${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.10"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: ubuntu-latest, python: "pypy3.11"}
          - {os: macos-latest, python: "3.13"}
          - {os: windows-latest, python: "3.13"}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Install the wheel into a clean environment and use it
        run: |
          python -m pip install -U pip
          python -m pip install --no-index --find-links dist heavykeeper-topk
          python -c "from topk import TopK; t = TopK(2, seed=1); t.update('abracadabra'); assert t.most_common() == [('a', 5), ('b', 2)], t.most_common(); print('wheel works:', t.most_common())"

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi'
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/heavykeeper-topk/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.repository == 'pypi')
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/heavykeeper-topk/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
