[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "heavykeeper-topk"
version = "0.1.0.dev0"
description = "Pure-Python HeavyKeeper: accurate, memory-bounded top-k frequent items in a data stream."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Debapriya Das" }]
keywords = ["heavykeeper", "top-k", "heavy-hitters", "elephant-flows", "sketch", "streaming", "frequency"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/light-bringer/topk"
Repository = "https://github.com/light-bringer/topk"
Issues = "https://github.com/light-bringer/topk/issues"
Changelog = "https://github.com/light-bringer/topk/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-benchmark>=4.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "build>=1.2",
    "twine>=5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/topk"]

[tool.hatch.build.targets.sdist]
include = ["src/topk", "tests", "benchmarks", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config -m 'not slow and not bench'"
markers = [
    "slow: statistical accuracy gates; run with `pytest -m slow`",
    "bench: pytest-benchmark microbenchmarks; run with `pytest -m bench --benchmark-only`",
]

[tool.coverage.run]
source = ["topk"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "benchmarks", "examples"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PT", "RUF"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src/topk", "examples"]
